tags:
  - Contacts
summary: Patch contact by idAdd commentMore actions
operationId: patchContact
description: 'Patch contact by id. Please provide only valid mongodb id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '684eb44a3c2fb94930a8e7cf'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          phoneNumber:
            type: string
            example: '+380930084080'
          email:
            description: "Student's age"
            type: string
            example: 'john.Doe@gmail.com'
          isFavourite:
            example: true
            default: false
          contactType:
            type: string
            enum:
              - personal
              - work
              - family
            example: 'personal'
          photo:
            type: string
            format: binary

responses:
  '200':
    description: 'Successfully updated a contact!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 65ca67e7ae7f10c88b598384!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
